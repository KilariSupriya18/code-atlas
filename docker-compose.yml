version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codementor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codementor
      POSTGRES_USER: codementor_user
      POSTGRES_PASSWORD: codementor_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codementor_user -d codementor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codementor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codementor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: codementor-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://codementor_user:codementor_secret_password@postgres:5432/codementor
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_FALLBACK_MODEL=${GROQ_FALLBACK_MODEL:-llama-3.1-8b-instant}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - REPO_STORAGE_PATH=/app/data/repos
      - FRONTEND_ORIGIN=http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - model_cache:/app/data/model_cache
      - repo_data:/app/data/repos

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: codementor-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  model_cache:
  repo_data:
